name: Build LTLINE Word Pack

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-word-pack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-docx
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Build professional Word documents
        run: python scripts/build_word_pack.py

      - name: Upload Word pack
        uses: actions/upload-artifact@v4
        with:
          name: LTLINE-Foundation-Pack-Word-SQ
          path: LTLINE-Foundation-Pack-Word-SQ.zip
          if-no-files-found: error
          retention-days: 30
